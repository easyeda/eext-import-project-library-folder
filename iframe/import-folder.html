<!doctype html>
<html lang="zh-Hans">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Load Project/Library Folder</title>
		<style>
			:root {
				--accent: #4f6bff;
				--accent-2: #8b5cf6;
				--accent-soft: rgba(79, 107, 255, 0.1);
				--ok: #16a34a;
				--ok-soft: rgba(22, 163, 74, 0.12);
				--err: #e11d48;
				--err-soft: rgba(225, 29, 72, 0.1);
				--warn: #d97706;
				--ink: #101828;
				--ink-2: #475467;
				--ink-3: #98a2b3;
				--line: #e7eaf3;
				--line-strong: #d6dbe9;
				--bg: #f5f7fc;
				--card: #ffffff;
				--radius: 14px;
				--shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.06);
				--shadow-md: 0 8px 24px rgba(16, 24, 40, 0.08);
				--shadow-lg: 0 18px 44px rgba(16, 24, 40, 0.14);
			}

			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}

			html,
			body {
				width: 100%;
				height: 100%;
				overflow: hidden;
				font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
				font-size: 13px;
				color: var(--ink);
				background: var(--bg);
				-webkit-font-smoothing: antialiased;
			}

			button,
			select,
			input {
				font-family: inherit;
				font-size: inherit;
				color: inherit;
			}

			.app {
				display: flex;
				flex-direction: column;
				width: 100%;
				height: 100%;
			}

			/* ---------- header ---------- */
			.hero {
				position: relative;
				display: flex;
				align-items: center;
				gap: 14px;
				padding: 18px 22px 16px;
				background: linear-gradient(125deg, #4f6bff 0%, #7257f8 55%, #8b5cf6 100%);
				color: #fff;
				overflow: hidden;
				flex: none;
			}

			.hero::after {
				content: '';
				position: absolute;
				inset: -60% -20% auto auto;
				width: 320px;
				height: 320px;
				background: radial-gradient(circle, rgba(255, 255, 255, 0.28), transparent 62%);
				pointer-events: none;
			}

			.hero-logo {
				display: flex;
				align-items: center;
				justify-content: center;
				width: 42px;
				height: 42px;
				border-radius: 12px;
				background: rgba(255, 255, 255, 0.18);
				border: 1px solid rgba(255, 255, 255, 0.32);
				backdrop-filter: blur(4px);
				flex: none;
			}

			.hero-logo svg {
				width: 24px;
				height: 24px;
			}

			.hero-text {
				min-width: 0;
			}

			.hero-title {
				font-size: 15.5px;
				font-weight: 600;
				letter-spacing: 0.2px;
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
			}

			.hero-sub {
				margin-top: 3px;
				font-size: 11.5px;
				color: rgba(255, 255, 255, 0.82);
			}

			/* ---------- steps ---------- */
			.steps {
				display: flex;
				align-items: center;
				gap: 8px;
				padding: 12px 22px;
				background: #fff;
				border-bottom: 1px solid var(--line);
				flex: none;
			}

			.step-chip {
				display: flex;
				align-items: center;
				gap: 7px;
				padding: 5px 11px 5px 6px;
				border-radius: 999px;
				font-size: 12px;
				color: var(--ink-3);
				background: #f2f4fa;
				transition: all 0.22s ease;
				white-space: nowrap;
			}

			.step-chip .idx {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				width: 18px;
				height: 18px;
				border-radius: 50%;
				font-size: 11px;
				font-weight: 600;
				background: #fff;
				color: var(--ink-3);
				box-shadow: var(--shadow-sm);
			}

			.step-chip.active {
				color: #fff;
				background: linear-gradient(120deg, var(--accent), var(--accent-2));
				box-shadow: 0 6px 16px rgba(79, 107, 255, 0.28);
			}

			.step-chip.active .idx {
				color: var(--accent);
			}

			.step-chip.done {
				color: var(--accent);
				background: var(--accent-soft);
			}

			.step-arrow {
				width: 14px;
				height: 1.5px;
				background: var(--line-strong);
				border-radius: 2px;
			}

			/* ---------- main ---------- */
			main {
				position: relative;
				flex: 1 1 auto;
				min-height: 0;
				padding: 18px 22px;
				overflow: hidden;
			}

			.screen {
				display: none;
				flex-direction: column;
				width: 100%;
				height: 100%;
				min-height: 0;
				animation: fade-in 0.22s ease;
			}

			.screen.active {
				display: flex;
			}

			@keyframes fade-in {
				from {
					opacity: 0;
					transform: translateY(6px);
				}
				to {
					opacity: 1;
					transform: none;
				}
			}

			/* ---------- drop zone ---------- */
			.dropzone {
				position: relative;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 10px;
				flex: 1 1 auto;
				min-height: 0;
				padding: 26px;
				border: 1.8px dashed var(--line-strong);
				border-radius: 18px;
				background:
					radial-gradient(circle at 50% 0%, rgba(79, 107, 255, 0.07), transparent 60%),
					#fff;
				text-align: center;
				cursor: pointer;
				transition: border-color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease;
			}

			.dropzone:hover {
				border-color: var(--accent);
				box-shadow: var(--shadow-md);
			}

			.dropzone.dragging {
				border-color: var(--accent);
				border-style: solid;
				background: linear-gradient(180deg, rgba(79, 107, 255, 0.1), rgba(139, 92, 246, 0.06));
				box-shadow: 0 0 0 4px rgba(79, 107, 255, 0.12), var(--shadow-lg);
				transform: scale(1.004);
			}

			.dz-icon {
				display: flex;
				align-items: center;
				justify-content: center;
				width: 72px;
				height: 72px;
				border-radius: 22px;
				background: linear-gradient(140deg, rgba(79, 107, 255, 0.14), rgba(139, 92, 246, 0.12));
				color: var(--accent);
			}

			.dz-icon svg {
				width: 38px;
				height: 38px;
			}

			.dz-title {
				font-size: 15px;
				font-weight: 600;
			}

			.dz-or {
				font-size: 11.5px;
				color: var(--ink-3);
			}

			.dz-hints {
				display: flex;
				flex-wrap: wrap;
				align-items: center;
				justify-content: center;
				gap: 6px 16px;
				margin-top: 2px;
				font-size: 11.5px;
				color: var(--ink-2);
			}

			.dz-hint {
				display: inline-flex;
				align-items: center;
				gap: 5px;
			}

			.dz-hint svg {
				width: 13px;
				height: 13px;
				color: var(--ok);
				flex: none;
			}

			.dz-picked {
				display: none;
				align-items: center;
				gap: 10px;
				width: 100%;
				max-width: 560px;
				margin-top: 4px;
				padding: 10px 14px;
				border-radius: 12px;
				background: #f4f7ff;
				border: 1px solid #dbe3ff;
				text-align: left;
			}

			.dz-picked.show {
				display: flex;
			}

			.dz-picked-icon {
				color: var(--accent);
				flex: none;
				display: flex;
			}

			.dz-picked-name {
				font-weight: 600;
				font-size: 12.5px;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}

			.dz-picked-meta {
				font-size: 11px;
				color: var(--ink-2);
				margin-top: 2px;
			}

			.dz-picked-clear {
				margin-left: auto;
				border: none;
				background: transparent;
				color: var(--ink-3);
				cursor: pointer;
				padding: 4px;
				border-radius: 8px;
				display: flex;
			}

			.dz-picked-clear:hover {
				color: var(--err);
				background: var(--err-soft);
			}

			/* ---------- usage guide ---------- */
			.guide {
				display: flex;
				flex-direction: column;
				gap: 6px;
				flex: none;
				margin-top: 12px;
				padding: 12px 15px 13px;
				list-style: none;
				border-radius: 12px;
				background: #fff;
				border: 1px solid var(--line);
				box-shadow: var(--shadow-sm);
			}

			.guide-title {
				display: flex;
				align-items: center;
				gap: 6px;
				margin-bottom: 1px;
				font-size: 12px;
				font-weight: 600;
				color: var(--ink-2);
			}

			.guide-title svg {
				width: 13px;
				height: 13px;
				color: var(--accent);
				flex: none;
			}

			.guide li {
				display: flex;
				align-items: flex-start;
				gap: 8px;
				font-size: 11.5px;
				line-height: 1.6;
				color: var(--ink-2);
			}

			.guide li .num {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				flex: none;
				width: 16px;
				height: 16px;
				margin-top: 1px;
				border-radius: 50%;
				background: var(--accent-soft);
				color: var(--accent);
				font-size: 10px;
				font-weight: 600;
			}

			.guide a {
				color: var(--accent);
				text-decoration: none;
				border-bottom: 1px solid rgba(79, 107, 255, 0.35);
				cursor: pointer;
			}

			.guide a:hover {
				color: var(--accent-2);
				border-bottom-color: var(--accent-2);
			}

			/* ---------- generic ---------- */
			.btn {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				gap: 7px;
				height: 34px;
				padding: 0 16px;
				border-radius: 10px;
				border: 1px solid var(--line-strong);
				background: #fff;
				color: var(--ink);
				font-size: 12.5px;
				font-weight: 500;
				cursor: pointer;
				transition: all 0.16s ease;
				white-space: nowrap;
			}

			.btn:hover:not(:disabled) {
				background: #f7f9ff;
				border-color: var(--accent);
				color: var(--accent);
			}

			.btn:disabled {
				opacity: 0.5;
				cursor: not-allowed;
			}

			.btn-primary {
				border: none;
				color: #fff;
				background: linear-gradient(120deg, var(--accent), var(--accent-2));
				box-shadow: 0 6px 16px rgba(79, 107, 255, 0.26);
			}

			/* 主按钮 hover 需要重新声明 background：否则会被 .btn:hover 的浅色底覆盖，
			   白色文字压在浅色背景上就看不见了。 */
			.btn-primary:hover:not(:disabled) {
				color: #fff;
				background: linear-gradient(120deg, var(--accent), var(--accent-2));
				filter: brightness(1.06);
				box-shadow: 0 8px 20px rgba(79, 107, 255, 0.34);
			}

			.btn-ghost {
				border-color: transparent;
				background: transparent;
				color: var(--ink-2);
			}

			.btn-ghost:hover:not(:disabled) {
				background: #eef1f8;
				border-color: transparent;
				color: var(--ink);
			}

			.btn svg {
				width: 15px;
				height: 15px;
			}

			/* ---------- review ---------- */
			.review {
				display: grid;
				grid-template-columns: minmax(0, 1fr) 288px;
				gap: 14px;
				flex: 1 1 auto;
				min-height: 0;
			}

			.panel {
				display: flex;
				flex-direction: column;
				min-height: 0;
				background: var(--card);
				border: 1px solid var(--line);
				border-radius: var(--radius);
				box-shadow: var(--shadow-sm);
				overflow: hidden;
			}

			.panel-head {
				display: flex;
				align-items: center;
				gap: 8px;
				padding: 11px 14px;
				border-bottom: 1px solid var(--line);
				flex: none;
				background: #fbfcff;
			}

			.panel-title {
				font-size: 12.5px;
				font-weight: 600;
			}

			.panel-count {
				padding: 1px 7px;
				border-radius: 999px;
				font-size: 11px;
				color: var(--accent);
				background: var(--accent-soft);
				font-weight: 600;
			}

			.panel-body {
				flex: 1 1 auto;
				min-height: 0;
				overflow: auto;
				padding: 10px;
			}

			.panel-body::-webkit-scrollbar,
			.run-list::-webkit-scrollbar {
				width: 8px;
			}

			.panel-body::-webkit-scrollbar-thumb,
			.run-list::-webkit-scrollbar-thumb {
				background: #d8deeb;
				border-radius: 999px;
			}

			.panel-body::-webkit-scrollbar-thumb:hover,
			.run-list::-webkit-scrollbar-thumb:hover {
				background: #c3cbdd;
			}

			.unit {
				display: flex;
				align-items: flex-start;
				gap: 10px;
				padding: 10px 11px;
				border-radius: 11px;
				border: 1px solid transparent;
				cursor: pointer;
				transition: background 0.15s ease, border-color 0.15s ease;
			}

			.unit:hover {
				background: #f7f9ff;
				border-color: #e3e9ff;
			}

			.unit.checked {
				background: #f4f7ff;
				border-color: #dbe3ff;
			}

			.unit-check {
				position: relative;
				flex: none;
				margin-top: 2px;
				width: 16px;
				height: 16px;
				border-radius: 5px;
				border: 1.6px solid var(--line-strong);
				background: #fff;
				transition: all 0.15s ease;
			}

			.unit.checked .unit-check {
				border-color: var(--accent);
				background: var(--accent);
			}

			.unit.checked .unit-check::after {
				content: '';
				position: absolute;
				left: 4.4px;
				top: 1.2px;
				width: 4.5px;
				height: 8.5px;
				border: solid #fff;
				border-width: 0 2px 2px 0;
				transform: rotate(42deg);
			}

			.unit-icon {
				display: flex;
				align-items: center;
				justify-content: center;
				flex: none;
				width: 32px;
				height: 32px;
				border-radius: 9px;
			}

			.unit-icon svg {
				width: 17px;
				height: 17px;
			}

			.unit-icon.project {
				color: #2563eb;
				background: rgba(37, 99, 235, 0.1);
			}

			.unit-icon.library {
				color: #7c3aed;
				background: rgba(124, 58, 237, 0.1);
			}

			.unit-icon.invalid {
				color: var(--err);
				background: var(--err-soft);
			}

			.unit-main {
				min-width: 0;
				flex: 1 1 auto;
			}

			.unit-top {
				display: flex;
				align-items: center;
				gap: 7px;
				min-width: 0;
			}

			.unit-name {
				font-size: 12.5px;
				font-weight: 600;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}

			.badge {
				flex: none;
				padding: 1px 7px;
				border-radius: 999px;
				font-size: 10.5px;
				font-weight: 600;
				letter-spacing: 0.2px;
			}

			.badge.project {
				color: #1d4ed8;
				background: rgba(37, 99, 235, 0.12);
			}

			.badge.library {
				color: #6d28d9;
				background: rgba(124, 58, 237, 0.12);
			}

			.badge.invalid {
				color: var(--err);
				background: var(--err-soft);
			}

			.unit-path {
				margin-top: 3px;
				font-size: 11px;
				color: var(--ink-3);
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
				direction: rtl;
				text-align: left;
			}

			.unit-meta {
				display: flex;
				flex-wrap: wrap;
				gap: 4px 10px;
				margin-top: 5px;
				font-size: 11px;
				color: var(--ink-2);
			}

			.unit-meta span {
				display: inline-flex;
				align-items: center;
				gap: 4px;
			}

			.unit-meta svg {
				width: 12px;
				height: 12px;
				color: var(--ink-3);
			}

			/* ---------- owner form ---------- */
			.form {
				display: flex;
				flex-direction: column;
				gap: 12px;
				padding: 13px 14px;
			}

			.field {
				display: flex;
				flex-direction: column;
				gap: 5px;
			}

			.field label {
				font-size: 11.5px;
				font-weight: 600;
				color: var(--ink-2);
			}

			.select-wrap {
				position: relative;
			}

			.select-wrap::after {
				content: '';
				position: absolute;
				right: 12px;
				top: 50%;
				width: 6px;
				height: 6px;
				border: solid var(--ink-3);
				border-width: 0 1.4px 1.4px 0;
				transform: translateY(-70%) rotate(45deg);
				pointer-events: none;
			}

			select {
				width: 100%;
				height: 33px;
				padding: 0 30px 0 10px;
				border-radius: 9px;
				border: 1px solid var(--line-strong);
				background: #fff;
				cursor: pointer;
				appearance: none;
				outline: none;
				transition: border-color 0.15s ease, box-shadow 0.15s ease;
				text-overflow: ellipsis;
			}

			select:hover:not(:disabled) {
				border-color: var(--accent);
			}

			select:focus {
				border-color: var(--accent);
				box-shadow: 0 0 0 3px rgba(79, 107, 255, 0.14);
			}

			select:disabled {
				opacity: 0.6;
				cursor: not-allowed;
			}

			.hint {
				font-size: 10.5px;
				color: var(--ink-3);
				line-height: 1.5;
			}

			.switch-row {
				display: flex;
				align-items: flex-start;
				gap: 8px;
				padding-top: 2px;
				cursor: pointer;
			}

			.switch-row input {
				margin-top: 1.5px;
				width: 14px;
				height: 14px;
				accent-color: var(--accent);
				cursor: pointer;
				flex: none;
			}

			.switch-row span {
				font-size: 11.5px;
				color: var(--ink-2);
				line-height: 1.45;
			}

			.divider {
				height: 1px;
				background: var(--line);
				margin: 2px 0;
			}

			/* ---------- run ---------- */
			.run-wrap {
				display: flex;
				flex-direction: column;
				gap: 12px;
				flex: 1 1 auto;
				min-height: 0;
			}

			.run-summary {
				display: flex;
				align-items: center;
				gap: 10px;
				padding: 12px 15px;
				background: var(--card);
				border: 1px solid var(--line);
				border-radius: var(--radius);
				box-shadow: var(--shadow-sm);
				flex: none;
			}

			.run-summary-icon {
				display: flex;
				align-items: center;
				justify-content: center;
				width: 34px;
				height: 34px;
				border-radius: 10px;
				background: var(--accent-soft);
				color: var(--accent);
				flex: none;
			}

			.run-summary-icon svg {
				width: 18px;
				height: 18px;
			}

			.run-summary-text {
				min-width: 0;
				flex: 1 1 auto;
			}

			.run-summary-title {
				font-size: 12.5px;
				font-weight: 600;
			}

			.run-summary-sub {
				margin-top: 2px;
				font-size: 11px;
				color: var(--ink-2);
			}

			.run-bar {
				margin-left: auto;
				width: 132px;
				height: 5px;
				border-radius: 999px;
				background: #eef1f8;
				overflow: hidden;
				flex: none;
			}

			.run-bar i {
				display: block;
				width: 0;
				height: 100%;
				border-radius: 999px;
				background: linear-gradient(90deg, var(--accent), var(--accent-2));
				transition: width 0.3s ease;
			}

			.run-list {
				display: flex;
				flex-direction: column;
				gap: 8px;
				flex: 1 1 auto;
				min-height: 0;
				overflow: auto;
				padding-right: 2px;
			}

			.run-item {
				padding: 11px 13px;
				background: var(--card);
				border: 1px solid var(--line);
				border-radius: 12px;
				box-shadow: var(--shadow-sm);
				transition: border-color 0.2s ease;
			}

			.run-item.running {
				border-color: #c7d3ff;
				box-shadow: 0 6px 18px rgba(79, 107, 255, 0.1);
			}

			.run-item.ok {
				border-color: rgba(22, 163, 74, 0.34);
			}

			.run-item.err {
				border-color: rgba(225, 29, 72, 0.34);
			}

			.run-head {
				display: flex;
				align-items: center;
				gap: 9px;
			}

			.run-name {
				font-size: 12.5px;
				font-weight: 600;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
				min-width: 0;
			}

			.run-state {
				margin-left: auto;
				display: inline-flex;
				align-items: center;
				gap: 6px;
				font-size: 11.5px;
				color: var(--ink-2);
				flex: none;
				white-space: nowrap;
			}

			.run-state.ok {
				color: var(--ok);
			}

			.run-state.err {
				color: var(--err);
			}

			.spinner {
				width: 13px;
				height: 13px;
				border-radius: 50%;
				border: 1.8px solid rgba(79, 107, 255, 0.22);
				border-top-color: var(--accent);
				animation: spin 0.72s linear infinite;
				flex: none;
			}

			@keyframes spin {
				to {
					transform: rotate(360deg);
				}
			}

			.run-state svg {
				width: 14px;
				height: 14px;
			}

			.run-detail {
				margin-top: 6px;
				font-size: 11px;
				color: var(--ink-3);
				line-height: 1.5;
			}

			.run-detail.error {
				color: var(--err);
				word-break: break-word;
			}

			.run-progress {
				margin-top: 8px;
				height: 4px;
				border-radius: 999px;
				background: #eef1f8;
				overflow: hidden;
			}

			.run-progress i {
				display: block;
				width: 0;
				height: 100%;
				border-radius: 999px;
				background: linear-gradient(90deg, var(--accent), var(--accent-2));
				transition: width 0.2s ease;
			}

			/* ---------- loading ---------- */
			.loading-screen {
				gap: 14px;
				align-items: center;
				justify-content: center;
			}

			.loading-box {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 12px;
			}

			.loading-ring {
				width: 42px;
				height: 42px;
				border-radius: 50%;
				border: 3px solid rgba(79, 107, 255, 0.16);
				border-top-color: var(--accent);
				animation: spin 0.8s linear infinite;
			}

			.loading-text {
				font-size: 12.5px;
				color: var(--ink-2);
			}

			/* ---------- footer ---------- */
			footer {
				display: flex;
				align-items: center;
				gap: 10px;
				padding: 12px 22px;
				background: #fff;
				border-top: 1px solid var(--line);
				flex: none;
			}

			.footer-info {
				font-size: 11.5px;
				color: var(--ink-3);
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}

			.footer-spacer {
				flex: 1 1 auto;
			}

			/* ---------- empty / error ---------- */
			.empty {
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 8px;
				height: 100%;
				padding: 30px;
				text-align: center;
				color: var(--ink-2);
			}

			.empty-icon {
				display: flex;
				align-items: center;
				justify-content: center;
				width: 54px;
				height: 54px;
				border-radius: 16px;

				color: var(--err);
			}

			.empty-icon svg {
				width: 26px;
				height: 26px;
			}

			.empty-title {
				font-size: 13px;
				font-weight: 600;
				color: var(--ink);
			}

			.empty-sub {
				font-size: 11.5px;
				color: var(--ink-3);
				max-width: 420px;
				line-height: 1.6;
			}

			/* ---------- toast ---------- */
			#toast-host {
				position: fixed;
				left: 50%;
				bottom: 66px;
				transform: translateX(-50%);
				display: flex;
				flex-direction: column;
				gap: 8px;
				z-index: 99;
				pointer-events: none;
			}

			.toast {
				display: flex;
				align-items: center;
				gap: 8px;
				max-width: 520px;
				padding: 9px 14px;
				border-radius: 10px;
				background: rgba(16, 24, 40, 0.92);

				font-size: 12px;

			.toast.error {

			.toast svg {
				width: 15px;
				height: 15px;
				flex: none;
			}

			@keyframes toast-in {
				from {
					opacity: 0;
					transform: translateY(8px);
				}
				to {
					opacity: 1;
					transform: none;
				}
			}

			(function () {

				 * Current UI language, resolved on boot; defaults to Chinese.
				 */
				var currentLanguage = 'zh-Hans';

					return String(language || '').toLowerCase().indexOf('zh') === 0;

					}
					catch (err) {

					}

					applyNavigator();
					return Promise.resolve();

				 * 取文案：中文优先用弹窗内置字典（不依赖 sys_I18n），其它语言再交给 sys_I18n。

									}
									if (footprintCount) {
										meta.push({ icon: 'file', text: t('${1} footprints', footprintCount) });
									}
								}
							}
						}

						units.push({
							id: nextUnitId++,
							kind: root.kind,
							source: 'folder',
							name: sanitizeName(name),
							path: root.dir || name,
							rootDir: root.dir,
							files: unitFiles,
							extraDirs: allDirs
								.filter(function (dir) {
									return !root.dir || dir.indexOf(root.dir + '/') === 0;
								})
								.map(function (dir) {
									return root.dir ? dir.slice(root.dir.length + 1) : dir;
								}),
							entryCount: unitFiles.length,
							bytes: bytes,
							meta: meta,
							status: 'ready',
						});
					}

					return units;
				}

				// ---------------------------------------------------------------- packing
				function unitEntries(unit) {
					var entries = [];
					for (var i = 0; i < unit.files.length; i++) {
						var record = unit.files[i];
						var relative = unit.rootDir ? record.path.slice(unit.rootDir.length + 1) : record.path;
						entries.push({ path: relative, file: record.file });
					}
					return entries;
				}

				/** 从文件相对路径（+ 已知目录）推导 zip 目录条目，保证归档结构与磁盘一致 */
				function collectDirectoryEntries(records, extraDirs) {
					var seen = {};
					var dirs = [];

					var addDir = function (dirPath) {
						var normalized = dirPath.replace(/\/+$/, '');
						if (!normalized || seen[normalized]) {
							return;
						}
						seen[normalized] = true;
						dirs.push({ path: normalized + '/', isDir: true, data: new Uint8Array(0) });
					};

					for (var i = 0; i < records.length; i++) {
						var segments = records[i].path.split('/');
						var current = '';
						for (var s = 0; s < segments.length - 1; s++) {
							current = current ? current + '/' + segments[s] : segments[s];
							addDir(current);
						}
					}
					for (var e = 0; e < (extraDirs || []).length; e++) {
						addDir(extraDirs[e]);
					}
					dirs.sort(function (a, b) {
						return a.path.localeCompare(b.path);
					});
					return dirs;
				}

				async function packUnit(unit, onProgress) {
					if (unit.source === 'archive') {
						var only = unit.files[0];
						return { blob: only.file, fileName: baseName(only.path) };
					}

					var records = unitEntries(unit);
					var prepared = [];
					for (var i = 0; i < records.length; i++) {
						var buffer = await records[i].file.arrayBuffer();
						prepared.push({
							path: records[i].path,
							data: new Uint8Array(buffer),
							lastModified: records[i].file.lastModified,
						});
						if (typeof onProgress === 'function') {
							onProgress(i + 1, records.length);
						}
					}

					// Repair a project folder that lost its metadata file.
					if (unit.kind === 'project') {
						var hasMeta = prepared.some(function (entry) {
							return entry.path.toLowerCase() === 'project2.json';
						});
						if (!hasMeta) {
							var synthesized = {
								title: unit.name,
								cbb_project: false,
								editorVersion: '',
								introduction: '',
								description: '',
								tags: '[]',
							};
							prepared.unshift({
								path: 'project2.json',
								data: new TextEncoder().encode(JSON.stringify(synthesized)),
								lastModified: Date.now(),
							});
						}
					}

					// Keep the folder structure of the original archive (IMAGE/ sub folders etc.).
					var withDirs = collectDirectoryEntries(prepared, unit.extraDirs || []).concat(prepared);

					var blob = await buildZipBlob(withDirs);
					var extension = unit.kind === 'project' ? '.epro2' : '.elibz2';
					return { blob: blob, fileName: unit.name + extension };
				}

				// ---------------------------------------------------------------- owner data
				async function loadTeams() {
					if (!EDA) {
						return [];
					}
					var teams = [];
					var seen = {};

					var addAll = function (list) {
						for (var i = 0; i < (list || []).length; i++) {
							var item = list[i];
							if (!item || !item.uuid || seen[item.uuid]) {
								continue;
							}
							seen[item.uuid] = true;
							teams.push({ uuid: String(item.uuid), name: String(item.name || item.title || item.uuid) });
						}
					};

					try {
						addAll(await EDA.dmt_Team.getAllInvolvedTeamInfo());
					}
					catch (err) {
						// ignore
					}
					try {
						addAll(await EDA.dmt_Team.getAllTeamsInfo());
					}
					catch (err) {
						// ignore
					}
					if (!teams.length) {
						try {
							var currentTeam = await EDA.dmt_Team.getCurrentTeamInfo();
							if (currentTeam) {
								addAll([currentTeam]);
							}
						}
						catch (err) {
							// ignore
						}
					}

					if (!teams.length) {
						try {
							var personal = await EDA.lib_LibrariesList.getPersonalLibraryUuid();
							if (personal) {
								teams.push({ uuid: String(personal), name: t('Personal library') });
							}
						}
						catch (err) {
							// ignore
						}
					}

					return teams;
				}

				async function loadFolders(teamUuid) {
					if (!EDA || !teamUuid) {
						return [];
					}
					var uuids = [];
					try {
						uuids = (await EDA.dmt_Folder.getAllFoldersUuid(teamUuid)) || [];
					}
					catch (err) {
						return [];
					}

					var infos = [];
					var folderInfos = await Promise.all(uuids.map(function (uuid) {
						return EDA.dmt_Folder.getFolderInfo(teamUuid, uuid).catch(function () {
							return null;
						});
					}));
					folderInfos.forEach(function (info) {
						if (info) {
							infos.push(info);
						}
					});

					var children = new Map();
					infos.forEach(function (info) {
						var parent = String(info.parentFolderUuid || '');
						if (parent === String(teamUuid)) {
							parent = '';
						}
						if (!children.has(parent)) {
							children.set(parent, []);
						}
						children.get(parent).push(info);
					});

					var flat = [];
					var walk = function (parent, depth) {
						var kids = children.get(parent) || [];
						kids.sort(function (a, b) {
							return String(a.name || '').localeCompare(String(b.name || ''));
						});
						kids.forEach(function (kid) {
							flat.push({ uuid: String(kid.uuid), name: String(kid.name || kid.uuid), depth: depth });
							walk(String(kid.uuid), depth + 1);
						});
					};
					walk('', 0);
					return flat;
				}

				// ---------------------------------------------------------------- rendering
				function setStep(step) {
					state.step = step;
					var screens = { pick: 'screen-pick', analyze: 'screen-analyzing', review: 'screen-review', run: 'screen-run' };
					Object.keys(screens).forEach(function (key) {
						var node = $(screens[key]);
						if (node) {
							node.classList.toggle('active', key === step);
						}
					});

					var order = ['pick', 'review', 'run'];
					var currentIndex = order.indexOf(step === 'analyze' ? 'pick' : step);
					var chips = document.querySelectorAll('.step-chip');
					for (var i = 0; i < chips.length; i++) {
						var chipStep = chips[i].getAttribute('data-step');
						var chipIndex = order.indexOf(chipStep);
						chips[i].classList.toggle('active', chipIndex === currentIndex);
						chips[i].classList.toggle('done', chipIndex < currentIndex);
					}
					updateFooter();
				}

				function updateFooter() {
					var btnBack = $('btn-back');
					var btnCancel = $('btn-cancel');
					var btnNext = $('btn-next');
					var info = $('footer-info');

					btnBack.style.display = 'none';
					btnCancel.style.display = '';
					btnNext.style.display = '';
					btnCancel.disabled = false;
					btnNext.disabled = false;

					if (state.step === 'pick') {
						var hasFiles = state.files.length > 0;
						btnNext.innerHTML = ICONS.arrow + '<span>' + escapeHtml(t('Import')) + '</span>';
						btnNext.disabled = !hasFiles || state.running;
						info.textContent = hasFiles
							? t('${1} files ready', state.files.length)
							: t('Pick a folder to start');
					}
					else if (state.step === 'analyze') {
						btnNext.disabled = true;
						btnCancel.disabled = true;
						info.textContent = '';
					}
					else if (state.step === 'review') {
						var selectedCount = Object.keys(state.selected).filter(function (key) {
							return state.selected[key];
						}).length;
						btnBack.style.display = '';
						btnNext.innerHTML = ICONS.arrow + '<span>' + escapeHtml(t('Start import')) + '</span>';
						btnNext.disabled = selectedCount === 0 || !state.owner.teamUuid;
						info.textContent = t('${1} selected', selectedCount);
					}
					else {
						btnCancel.style.display = 'none';
						btnNext.innerHTML = '<span>' + escapeHtml(t('Close')) + '</span>';
						btnNext.disabled = state.running;
					}
				}

				function renderPickedFolder() {
					var picked = $('dz-picked');
					if (!state.files.length) {
						picked.classList.remove('show');
						updateFooter();
						return;
					}
					var names = state.rootNames.length ? state.rootNames : [t('Files')];
					var totalBytes = state.files.reduce(function (sum, record) {
						return sum + (record.file.size || 0);
					}, 0);
					$('dz-picked-name').textContent = names.join(', ');
					$('dz-picked-meta').textContent = t('${1} files, ${2}', state.files.length, formatBytes(totalBytes));
					picked.classList.add('show');
					updateFooter();
				}

				function renderUnits() {
					var list = $('unit-list');
					list.innerHTML = '';
					$('unit-count').textContent = String(state.units.length);

					if (!state.units.length) {
						list.appendChild(el('div', 'empty', ICONS.invalid + '<div class="empty-title">' + escapeHtml(t('No project or library folder detected')) + '</div><div class="empty-sub">' + escapeHtml(t('A project folder contains project2.json (*.epru), a library folder contains device2.json (*.elibu).')) + '</div>'));
						return;
					}

					state.units.forEach(function (unit) {
						var node = el('div', 'unit' + (state.selected[unit.id] ? ' checked' : ''));
						node.setAttribute('data-unit', String(unit.id));

						var badgeClass = unit.kind === 'project' ? 'project' : (unit.kind === 'library' ? 'library' : 'invalid');
						var badgeText = unit.kind === 'project' ? t('Project') : (unit.kind === 'library' ? t('Library') : t('Archive'));
						var iconClass = unit.kind === 'project' ? 'project' : (unit.kind === 'library' ? 'library' : 'invalid');
						var icon = unit.kind === 'project' ? ICONS.project : (unit.kind === 'library' ? ICONS.library : ICONS.file);

						var metaHtml = unit.meta.map(function (item) {
							return '<span>' + (ICONS[item.icon] || '') + escapeHtml(item.text) + '</span>';
						}).join('');

						node.innerHTML =
							'<div class="unit-check"></div>'
							+ '<div class="unit-icon ' + iconClass + '">' + icon + '</div>'
							+ '<div class="unit-main">'
							+ '<div class="unit-top"><span class="unit-name">' + escapeHtml(unit.name) + '</span><span class="badge ' + badgeClass + '">' + escapeHtml(badgeText) + '</span></div>'
							+ '<div class="unit-path" title="' + escapeHtml(unit.path) + '">' + escapeHtml(unit.path) + '</div>'
							+ '<div class="unit-meta">' + metaHtml + '</div>'
							+ '</div>';

						node.addEventListener('click', function () {
							state.selected[unit.id] = !state.selected[unit.id];
							node.classList.toggle('checked', !!state.selected[unit.id]);
							updateFooter();
						});

						list.appendChild(node);
					});
				}

				function renderTeams() {
					var select = $('owner-team');
					select.innerHTML = '';
					if (!state.teams.length) {
						var option = document.createElement('option');
						option.value = '';
						option.textContent = t('No workspace found');
						select.appendChild(option);
						select.disabled = true;
						return;
					}
					select.disabled = false;
					state.teams.forEach(function (team) {
						var node = document.createElement('option');
						node.value = team.uuid;
						node.textContent = team.name;
						select.appendChild(node);
					});
					select.value = state.owner.teamUuid || state.teams[0].uuid;
					state.owner.teamUuid = select.value;
				}

				function renderFolders() {
					var select = $('owner-folder');
					select.innerHTML = '';
					var root = document.createElement('option');
					root.value = '';
					root.textContent = t('Root directory of the team');
					select.appendChild(root);

					state.folders.forEach(function (folder) {
						var node = document.createElement('option');
						node.value = folder.uuid;
						node.textContent = new Array(folder.depth + 1).join('\u00A0\u00A0\u00A0') + (folder.depth > 0 ? '\u2514 ' : '') + folder.name;
						select.appendChild(node);
					});
					select.value = state.owner.folderUuid || '';
					state.owner.folderUuid = select.value;

					$('owner-hint').textContent = state.folders.length
						? t('${1} folders in this workspace', state.folders.length)
						: t('Projects are imported into the root directory of the selected workspace.');
				}

				function renderRunList() {
					var list = $('run-list');
					list.innerHTML = '';
					state.units.forEach(function (unit) {
						if (!state.selected[unit.id]) {
							return;
						}
						var node = el('div', 'run-item');
						node.setAttribute('data-unit', String(unit.id));
						var badgeClass = unit.kind === 'project' ? 'project' : 'library';
						var badgeText = unit.kind === 'project' ? t('Project') : t('Library');
						node.innerHTML =
							'<div class="run-head">'
							+ '<span class="unit-name">' + escapeHtml(unit.name) + '</span>'
							+ '<span class="badge ' + badgeClass + '">' + escapeHtml(badgeText) + '</span>'
							+ '<span class="run-state" data-role="state"><span class="spinner"></span><span>' + escapeHtml(t('Waiting')) + '</span></span>'
							+ '</div>'
							+ '<div class="run-progress"><i data-role="bar"></i></div>'
							+ '<div class="run-detail" data-role="detail"></div>';
						list.appendChild(node);
					});
				}

				function updateRunItem(unit, status, detail, progress) {
					var node = document.querySelector('.run-item[data-unit="' + unit.id + '"]');
					if (!node) {
						return;
					}
					var stateNode = node.querySelector('[data-role="state"]');
					var barNode = node.querySelector('[data-role="bar"]');
					var detailNode = node.querySelector('[data-role="detail"]');

					node.classList.toggle('running', status === 'running');
					node.classList.toggle('ok', status === 'ok');
					node.classList.toggle('err', status === 'err');

					var label = t('Waiting');
					var inner = '<span class="spinner"></span><span>' + escapeHtml(label) + '</span>';
					if (status === 'running') {
						inner = '<span class="spinner"></span><span>' + escapeHtml(detail || t('Working...')) + '</span>';
					}
					else if (status === 'ok') {
						inner = ICONS.check + '<span>' + escapeHtml(t('Imported')) + '</span>';
					}
					else if (status === 'err') {
						inner = ICONS.close + '<span>' + escapeHtml(t('Failed')) + '</span>';
					}
					stateNode.innerHTML = inner;

					if (typeof progress === 'number') {
						barNode.style.width = Math.max(0, Math.min(100, progress)) + '%';
					}
					if (status === 'ok') {
						barNode.style.width = '100%';
					}
					if (detailNode) {
						detailNode.textContent = (status === 'err' && detail) ? detail : '';
						detailNode.classList.toggle('error', status === 'err');
					}
				}

				function updateRunSummary(title, sub, percent) {
					$('run-title').textContent = title;
					$('run-sub').textContent = sub || '';
					$('run-bar').style.width = Math.max(0, Math.min(100, percent || 0)) + '%';
				}

				// ---------------------------------------------------------------- flow
				async function applyPickedFiles(picked) {
					var files = (picked && picked.files) || [];
					if (!files.length) {
						toast(t('The selected folder is empty.'), 'error');
						return;
					}
					state.files = files;
					state.dirs = (picked && picked.dirs) || [];
					var roots = {};
					files.forEach(function (record) {
						var head = normalizePath(record.path).split('/')[0];
						if (head && head.indexOf('.') !== 0) {
							roots[head] = true;
						}
					});
					state.rootNames = Object.keys(roots).slice(0, 3);
					renderPickedFolder();
					if (state.files.length > 40000) {
						toast(t('This folder contains a huge number of files (${1}). Analysis may take a while.', state.files.length));
					}
				}

				async function startAnalysis() {
					if (!state.files.length || state.running) {
						return;
					}
					setStep('analyze');
					$('analyzing-text').textContent = t('Analyzing folder structure...');

					try {
						var units = await createUnits(state.files, state.dirs || []);
						state.units = units;
						state.selected = {};
						units.forEach(function (unit) {
							state.selected[unit.id] = true;
						});

						if (!units.length) {
							toast(t('No project or library folder detected.'), 'error');
							setStep('pick');
							return;
						}

						$('analyzing-text').textContent = t('Reading workspace information...');
						state.teams = await loadTeams();
						if (state.teams.length) {
							state.owner.teamUuid = state.owner.teamUuid && state.teams.some(function (team) {
								return team.uuid === state.owner.teamUuid;
							})
								? state.owner.teamUuid
								: state.teams[0].uuid;
							state.folders = await loadFolders(state.owner.teamUuid);
						}

						renderTeams();
						renderFolders();
						renderUnits();
						setStep('review');
					}
					catch (err) {
						console.error('[ImportFolder] analysis failed:', err);
						toast(t('Failed to analyze the folder: ${1}', String(err)), 'error');
						setStep('pick');
					}
				}

				async function importUnit(unit, options) {
					var owner = state.owner;
					var packed = await packUnit(unit, function (done, total) {
						updateRunItem(unit, 'running', t('Packing ${1} / ${2}', done, total), Math.round((done / Math.max(total, 1)) * 60));
					});

					updateRunItem(unit, 'running', t('Importing...'), 70);

					var safeName = sanitizeName(unit.name);
					var kind = packed.fileName.toLowerCase().indexOf('.elibz2') >= 0 ? 'library' : (packed.fileName.toLowerCase().indexOf('.epro2') >= 0 ? 'project' : (unit.kind === 'library' ? 'library' : 'project'));

					var saveTo = {
						operation: 'New Project',
						newProjectOwnerTeamUuid: owner.teamUuid,
						newProjectFriendlyName: unit.name,
						newProjectDescription: '',
						newProjectCollaborationMode: 1,
					};
					if (owner.folderUuid) {
						saveTo.newProjectOwnerFolderUuid = owner.folderUuid;
					}

					var librariesImportSetting = {
						ownerTeamUuid: owner.teamUuid,
						createDeviceForSingleSymbol: options.createDeviceForSingleSymbol !== false,
					};

					var attempts = [];
					if (kind === 'library') {
						attempts.push({ name: safeName + '.elibz2', importOption: 'ExtractLibraries' });
						attempts.push({ name: safeName + '.zip', importOption: 'ExtractLibraries' });
					}
					else if (unit.kind === 'auto') {
						// Unknown archive flavour: try both pipelines before giving up.
						attempts.push({ name: safeName + '.epro2', importOption: 'ImportDocument' });
						attempts.push({ name: safeName + '.elibz2', importOption: 'ExtractLibraries' });
						attempts.push({ name: safeName + '.zip', importOption: 'ExtractLibraries' });
					}
					else {
						attempts.push({ name: safeName + '.epro2', importOption: 'ImportDocument' });
						attempts.push({ name: safeName + '_' + randomSuffix(4) + '.epro2', importOption: 'ImportDocument' });
					}

					var lastError = null;
					for (var i = 0; i < attempts.length; i++) {
						var attempt = attempts[i];
						try {
							var importFile = new File([packed.blob], attempt.name, { type: 'application/zip' });
							var result = await EDA.sys_FileManager.importProjectByProjectFile(
								importFile,
								'EasyEDA Pro',
								{ importOption: attempt.importOption },
								saveTo,
								librariesImportSetting,
							);
							if (result) {
								updateRunItem(unit, 'ok', '', 100);
								return { ok: true, result: result, kind: kind };
							}
							lastError = new Error(t('EasyEDA rejected the package "${1}"', attempt.name));
						}
						catch (err) {
							lastError = err;
						}
					}

					throw lastError || new Error(t('Import failed'));
				}

				async function startImport() {
					if (state.running) {
						return;
					}
					var queue = state.units.filter(function (unit) {
						return state.selected[unit.id];
					});
					if (!queue.length || !state.owner.teamUuid) {
						return;
					}

					state.running = true;
					setStep('run');
					renderRunList();
					updateRunSummary(t('Importing...'), t('${1} / ${2}', 0, queue.length), 0);
					updateFooter();

					var options = {
						createDeviceForSingleSymbol: $('opt-device').checked,
					};
					var openAfter = $('opt-open').checked;

					var succeeded = 0;
					var failed = 0;
					var lastProjectUuid = '';

					for (var i = 0; i < queue.length; i++) {
						var unit = queue[i];
						updateRunSummary(t('Importing "${1}"', unit.name), t('${1} / ${2}', i + 1, queue.length), Math.round((i / queue.length) * 100));
						try {
							var outcome = await importUnit(unit, options);
							succeeded++;
							if (outcome && outcome.result && outcome.result.uuid && outcome.kind === 'project') {
								lastProjectUuid = String(outcome.result.uuid);
							}
						}
						catch (err) {
							console.error('[ImportFolder] import failed:', unit.name, err);
							failed++;
							updateRunItem(unit, 'err', String(err && err.message ? err.message : err), 100);
						}
					}

					state.running = false;
					updateRunSummary(
						failed ? t('Import finished with errors') : t('Import completed'),
						t('${1} succeeded, ${2} failed', succeeded, failed),
						100,
					);

					if (openAfter && lastProjectUuid && EDA && EDA.dmt_Project) {
						try {
							await EDA.dmt_Project.openProject(lastProjectUuid);
						}
						catch (err) {
							console.warn('[ImportFolder] openProject failed:', err);
						}
					}

					updateFooter();
				}

				function closeDialog() {
					try {
						if (EDA && EDA.sys_Storage) {
							EDA.sys_Storage.setExtensionUserConfig('importFolderDialogCmd', JSON.stringify({ cmd: 'close', seq: Date.now() }));
						}
					}
					catch (err) {
						// ignore
					}
					try {
						if (EDA && EDA.sys_IFrame) {
							EDA.sys_IFrame.closeIFrame();
						}
					}
					catch (err) {
						// ignore
					}
				}

				// ---------------------------------------------------------------- wiring
				function localize() {
					document.title = t('Load Project/Library Folder');
					$('hero-title').textContent = t('Load Project/Library Folder');
					$('hero-sub').textContent = t('Projects (.epro2) and libraries (.elibz2) are packed in memory, so encrypted files never block the import.');
					$('dz-title').textContent = t('Drag & drop a folder here');
					$('dz-or').textContent = t('or');
					$('dz-hints').innerHTML =
						'<span class="dz-hint">' + ICONS.shield + escapeHtml(t('Nested project and library folders are detected automatically')) + '</span>'
						+ '<span class="dz-hint">' + ICONS.shield + escapeHtml(t('Everything is packed in memory, nothing is written to disk')) + '</span>';
					var targets = document.querySelectorAll('[data-i18n]');
					for (var i = 0; i < targets.length; i++) {
						targets[i].textContent = t(targets[i].getAttribute('data-i18n'));
					}
				}

				function bindEvents() {
					var dropzone = $('dropzone');
					var folderInput = $('folder-input');

					['dragenter', 'dragover'].forEach(function (type) {
						dropzone.addEventListener(type, function (event) {
							event.preventDefault();
							event.stopPropagation();
							dropzone.classList.add('dragging');
						});
					});
					['dragleave', 'dragend'].forEach(function (type) {
						dropzone.addEventListener(type, function (event) {
							event.preventDefault();
							event.stopPropagation();
							if (event.target === dropzone) {
								dropzone.classList.remove('dragging');
							}
						});
					});

					dropzone.addEventListener('drop', async function (event) {
						event.preventDefault();
						event.stopPropagation();
						dropzone.classList.remove('dragging');
						try {
							var files = await collectFromDataTransfer(event.dataTransfer);
							await applyPickedFiles(files);
						}
						catch (err) {
							console.error('[ImportFolder] drop failed:', err);
							toast(t('Failed to read the folder: ${1}', String(err)), 'error');
						}
					});

					window.addEventListener('dragover', function (event) {
						event.preventDefault();
					});
					window.addEventListener('drop', function (event) {
						event.preventDefault();
					});

					dropzone.addEventListener('click', function (event) {
						if (event.target.closest('#btn-clear')) {
							return;
						}
						browseFolder();
					});

					$('btn-browse').addEventListener('click', function (event) {
						event.stopPropagation();
						browseFolder();
					});

					$('btn-clear').addEventListener('click', function (event) {
						event.stopPropagation();
						state.files = [];
						state.dirs = [];
						state.rootNames = [];
						state.units = [];
						state.selected = {};
						renderPickedFolder();
					});

					folderInput.addEventListener('change', async function () {
						try {
							var files = fromWebkitRelativePaths(folderInput.files);
							folderInput.value = '';
							await applyPickedFiles(files);
						}
						catch (err) {
							console.error('[ImportFolder] input failed:', err);
							toast(t('Failed to read the folder: ${1}', String(err)), 'error');
						}
					});

					$('owner-team').addEventListener('change', async function () {
						state.owner.teamUuid = $('owner-team').value;
						state.owner.folderUuid = '';
						$('owner-hint').textContent = t('Loading folders...');
						state.folders = await loadFolders(state.owner.teamUuid);
						renderFolders();
						updateFooter();
					});

					$('owner-folder').addEventListener('change', function () {
						state.owner.folderUuid = $('owner-folder').value;
					});

					$('btn-select-all').addEventListener('click', function () {
						var allSelected = state.units.every(function (unit) {
							return state.selected[unit.id];
						});
						state.units.forEach(function (unit) {
							state.selected[unit.id] = !allSelected;
						});
						renderUnits();
						updateFooter();
					});

					$('btn-next').addEventListener('click', function () {
						if (state.step === 'pick') {
							startAnalysis();
						}
						else if (state.step === 'review') {
							startImport();
						}
						else if (state.step === 'run') {
							closeDialog();
						}
					});

					$('btn-back').addEventListener('click', function () {
						if (state.step === 'review') {
							setStep('pick');
						}
					});

					$('btn-cancel').addEventListener('click', function () {
						closeDialog();
					});

					// 使用说明里的外链：优先用 EDA 的打开接口交给系统浏览器，失败再退回 window.open
					var guideLink = $('link-export-archive');
					if (guideLink) {
						guideLink.addEventListener('click', function (event) {
							event.preventDefault();
							event.stopPropagation();
							var url = guideLink.getAttribute('href');
							try {
								if (EDA && EDA.sys_Window && typeof EDA.sys_Window.open === 'function') {
									EDA.sys_Window.open(url);
									return;
								}
							}
							catch (err) {
								console.warn('[ImportFolder] sys_Window.open failed:', err);
							}
							try {
								window.open(url, '_blank');
							}
							catch (err) {
								console.warn('[ImportFolder] window.open failed:', err);
							}
						});
					}
				}

				async function browseFolder() {
					if (state.running) {
						return;
					}
					try {
						var fromEda = await collectFromEdaFolderDialog();
						if (fromEda && fromEda.files && fromEda.files.length) {
							await applyPickedFiles(fromEda);
							return;
						}
						if (fromEda === null) {
							$('folder-input').click();
						}
					}
					catch (err) {
						console.warn('[ImportFolder] folder dialog unavailable, falling back to input:', err);
						$('folder-input').click();
					}
				}

				async function boot() {
					try {
						await resolveLanguage();
						localize();
						bindEvents();
						setStep('pick');
						renderPickedFolder();
						if (!EDA) {
							toast(t('The EasyEDA API is not available. Please use this extension inside EasyEDA Pro.'), 'error');
						}
					}
					catch (err) {
						console.error('[ImportFolder] initialization failed:', err);
					}
				}

				if (document.readyState === 'loading') {
					document.addEventListener('DOMContentLoaded', function () {
						boot();
					});
				}
				else {
					boot();
				}
			})();
		</script>
	</body>
</html>
